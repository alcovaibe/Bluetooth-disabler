name: Android Full Compatibility

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify project
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

  instrumented-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            arch: x86_64
          - api-level: 27
            arch: x86
          - api-level: 28
            arch: x86_64
          - api-level: 29
            arch: x86_64
          - api-level: 30
            arch: x86_64
          - api-level: 31
            arch: x86_64
          - api-level: 32
            arch: x86_64
          - api-level: 33
            arch: x86_64
          - api-level: 34
            arch: x86_64
          - api-level: 35
            arch: x86_64
          - api-level: 36
            arch: x86_64
          - api-level: '37.0'
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify full Android compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          enable-hw-keyboard: true
          ram-size: ${{ matrix.api-level == '37.0' && '4096M' || '2048M' }}
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 0
            ./gradlew connectedDebugAndroidTest
            python3 scripts/verify_android_test_results.py
            adb pull /data/local/tmp/calendar-previews app/build/calendar-previews

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-full-tests-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/calendar-previews/
