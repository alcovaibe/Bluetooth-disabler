name: Android Full Compatibility

on:
  workflow_call:
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify project
        run: ./gradlew testDebugUnitTest testInternalUnitTest lintDebug lintInternal assembleDebug assembleDebugAndroidTest

      - name: Restore persistent internal signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo 'Persistent signing key is missing; no installable internal APK will be published.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/bluetooth-disable-internal.jks"
          test -s "$RUNNER_TEMP/bluetooth-disable-internal.jks"
          echo "INTERNAL_VERSION_CODE=$((1000000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      - name: Build internal APK with persistent signature
        env:
          INTERNAL_SIGNING_REQUIRED: 'true'
          INTERNAL_STORE_FILE: ${{ runner.temp }}/bluetooth-disable-internal.jks
          INTERNAL_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          INTERNAL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          INTERNAL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleInternal

      - name: Verify internal APK signature and version
        env:
          INTERNAL_STORE_FILE: ${{ runner.temp }}/bluetooth-disable-internal.jks
          INTERNAL_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          INTERNAL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: python3 scripts/verify_internal_signing.py

      - name: Upload internal test APK
        uses: actions/upload-artifact@v7
        with:
          name: bluetooth-disable-internal
          path: app/build/outputs/apk/internal/*.apk
          if-no-files-found: error

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bluetooth-disable-internal.jks"

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            arch: x86_64
          - api-level: 27
            arch: x86
          - api-level: 28
            arch: x86_64
          - api-level: 29
            arch: x86_64
          - api-level: 30
            arch: x86_64
          - api-level: 31
            arch: x86_64
          - api-level: 32
            arch: x86_64
          - api-level: 33
            arch: x86_64
          - api-level: 34
            arch: x86_64
          - api-level: 35
            arch: x86_64
          - api-level: 36
            arch: x86_64
          # API 37.0 currently crashes SurfaceFlinger before tests can run.
          # Restore Android 17 after a compatible emulator/image is verified.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify full Android compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          enable-hw-keyboard: true
          ram-size: 2048M
          # The action's heap-size input writes hw.heapSize; AVD uses vm.heapSize.
          pre-emulator-launch-script: sed -i '/^vm.heapSize=/d; $a vm.heapSize=512' "$HOME/.android/avd/test.avd/config.ini"
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: bash scripts/run_android_tests.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-full-tests-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/calendar-previews/
            app/build/android-ci/
