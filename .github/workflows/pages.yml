name: Deploy Cloudflare Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/pages/**'
      - 'wrangler.jsonc'
      - 'scripts/update-site-releases.mjs'
      - 'scripts/android_updates.py'
      - 'scripts/verify_internal_signing.py'
      - 'config/android-updates.json'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, unpublished, deleted]
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bluetooth-disable-cloudflare-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # The URL contract is checked before any site deployment.
      - name: Verify public URLs
        run: python3 scripts/sync_site_urls.py --check

      - name: Refresh release snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-site-releases.mjs

      - name: Set up JDK for APK signature verification
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android APK inspection tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Verify published APK and generate monotonic update manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/android_updates.py

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify public update manifest after deployment
        run: python3 scripts/android_updates.py --verify-live
