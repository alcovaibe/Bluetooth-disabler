name: Deploy Cloudflare Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/pages/**'
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'scripts/create-cloudflare-deploy-config.mjs'
      - 'scripts/update-site-releases.mjs'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, unpublished, deleted]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluetooth-disable-cloudflare-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh release snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-site-releases.mjs

      - name: Test config endpoint and generate deployment configuration
        env:
          CLOUDFLARE_TEST_CONFIG_KV_ID: ${{ vars.CLOUDFLARE_TEST_CONFIG_KV_ID }}
        run: |
          node --test cloudflare/worker.test.mjs scripts/create-cloudflare-deploy-config.test.mjs
          node scripts/create-cloudflare-deploy-config.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.deploy.json
