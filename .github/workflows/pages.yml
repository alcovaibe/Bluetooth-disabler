name: Deploy Cloudflare Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/pages/**'
      - 'wrangler.jsonc'
      - 'scripts/update-site-releases.mjs'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, unpublished, deleted]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluetooth-disable-cloudflare-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The URL contract is checked before any site deployment.
      - name: Verify public URLs
        run: python3 scripts/sync_site_urls.py --check

      - name: Refresh release snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-site-releases.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
