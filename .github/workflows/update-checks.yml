name: Update manifest checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test publisher and publication guards
        run: python3 -m unittest discover -s scripts -p android_updates_tests.py
      # Production availability is external to a PR; preserve failures in the step log.
      # The JSON endpoint is expected to be 404 before the feature is deployed.
      - name: Read-only public site availability probe
        continue-on-error: true
        run: python3 scripts/android_updates.py --probe-site
