name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify tag matches versionName
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "v${VERSION_NAME}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match versionName ${VERSION_NAME}; release tags must use v<version>."
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bluetooth-disable-release.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/bluetooth-disable-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          ASSET_NAME="BluetoothDisable-v${VERSION_NAME}.apk"
          APK_PATH="app/build/outputs/apk/release/${ASSET_NAME}"
          test -f "$APK_PATH"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" \
            "$APK_PATH" \
            --title "Bluetooth Disable ${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --notes ""

      - name: Generate Device Owner provisioning QR
        id: provisioning
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          ASSET_NAME: ${{ steps.apk.outputs.asset_name }}
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'qrcode[pil]>=8,<9'
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          import qrcode

          apk_path = Path(os.environ["APK_PATH"])
          asset_name = os.environ["ASSET_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]

          digest = hashlib.sha256(apk_path.read_bytes()).digest()
          checksum = base64.urlsafe_b64encode(digest).decode("ascii").rstrip("=")
          download_url = f"https://github.com/{repository}/releases/download/{tag}/{asset_name}"

          payload = {
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME": (
                  "com.pulse.bluetoothdisable/.admin.AppDeviceAdminReceiver"
              ),
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION": download_url,
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM": checksum,
          }
          payload_text = json.dumps(payload, ensure_ascii=False, separators=(",", ":"))

          out_dir = Path("release-provisioning")
          out_dir.mkdir(parents=True, exist_ok=True)
          qr_path = out_dir / "bluetooth-disable-device-owner-qr.png"

          qr = qrcode.QRCode(
              error_correction=qrcode.constants.ERROR_CORRECT_M,
              box_size=8,
              border=4,
          )
          qr.add_data(payload_text)
          qr.make(fit=True)
          qr.make_image(fill_color="black", back_color="white").save(qr_path)

          print(f"Provisioning download URL: {download_url}")
          print(f"Provisioning APK checksum: {checksum}")
          PY
          echo "qr_path=release-provisioning/bluetooth-disable-device-owner-qr.png" >> "$GITHUB_OUTPUT"

      - name: Attach provisioning QR to release
        env:
          GH_TOKEN: ${{ github.token }}
          QR_PATH: ${{ steps.provisioning.outputs.qr_path }}
        shell: bash
        run: |
          gh release upload "${RELEASE_TAG}" "$QR_PATH" --clobber

