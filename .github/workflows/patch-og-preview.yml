name: Patch OG preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-og-preview.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove small Bluetooth square from OG image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageDraw

          path = "docs/pages/assets/images/og-image-v2.jpg"
          im = Image.open(path).convert("RGB")
          w, h = im.size

          # The small blue Bluetooth square occupies the otherwise empty
          # upper-left background. Rebuild that area from the adjacent
          # clean background and feather the edges for a seamless blend.
          x0, y0 = int(w * 0.045), int(h * 0.145)
          x1, y1 = int(w * 0.155), int(h * 0.350)
          pw, ph = x1 - x0, y1 - y0

          sx0 = int(w * 0.175)
          sy0 = y0
          patch = im.crop((sx0, sy0, sx0 + pw, sy0 + ph))

          # Slight blur keeps the reconstructed background free of JPEG seams.
          patch = patch.filter(ImageFilter.GaussianBlur(radius=max(1, int(w / 900))))

          mask = Image.new("L", (pw, ph), 0)
          draw = ImageDraw.Draw(mask)
          feather = max(8, int(w * 0.012))
          draw.rounded_rectangle(
              (feather, feather, pw - feather, ph - feather),
              radius=feather,
              fill=255,
          )
          mask = mask.filter(ImageFilter.GaussianBlur(radius=feather))

          im.paste(patch, (x0, y0), mask)
          im.save(path, "JPEG", quality=95, optimize=True, progressive=True)
          print(f"Patched {path}: {w}x{h}")
          PY

      - name: Commit patched preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pages/assets/images/og-image-v2.jpg
          if git diff --cached --quiet; then
            echo "No image change detected"
            exit 0
          fi
          git commit -m "site: remove small Bluetooth icon from social preview"
          git push
