name: Build Internal for published release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: internal-published-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate published version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout the published release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          echo "INTERNAL_VERSION_CODE=$((1000000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Internal
        run: |
          chmod +x gradlew
          ./gradlew testInternalUnitTest lintInternal

      - name: Restore persistent Internal signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/bluetooth-disable-internal.jks"

      - name: Build Internal from published source
        env:
          INTERNAL_SIGNING_REQUIRED: 'true'
          INTERNAL_STORE_FILE: ${{ runner.temp }}/bluetooth-disable-internal.jks
          INTERNAL_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          INTERNAL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          INTERNAL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleInternal

      - name: Verify Internal APK signature and version
        env:
          INTERNAL_STORE_FILE: ${{ runner.temp }}/bluetooth-disable-internal.jks
          INTERNAL_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          INTERNAL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: python3 scripts/verify_internal_signing.py

      - name: Upload verified Internal APK for private import
        uses: actions/upload-artifact@v7
        with:
          name: bluetooth-disable-internal
          path: app/build/outputs/apk/internal/*.apk
          if-no-files-found: error

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bluetooth-disable-internal.jks"
