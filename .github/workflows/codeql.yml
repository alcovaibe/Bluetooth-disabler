name: CodeQL Analysis

on:
  workflow_call:
    inputs:
      android:
        type: boolean
        required: true
      windows:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      android:
        type: boolean
        default: true
      windows:
        type: boolean
        default: false

jobs:
  analyze:
    name: Analyze Android
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Initialize Android CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Android for CodeQL
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache :app:assembleDebug
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  windows:
    name: Analyze Windows C#
    if: inputs.windows
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - name: Initialize Windows CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Restore and build Windows for CodeQL
        run: |
          dotnet restore BluetoothDisable.sln -p:Configuration=Release -p:Platform=x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build BluetoothDisable.sln -c Release -p:Platform=x64 --no-restore --no-incremental -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
