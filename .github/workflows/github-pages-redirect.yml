name: Redirect GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/github-pages-redirect/**'
      - '.github/workflows/github-pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-redirect
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy redirect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/github-pages-redirect

      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
