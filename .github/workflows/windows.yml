name: Windows CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows x64 (${{ matrix.configuration }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Prepare diagnostics
        run: |
          New-Item -ItemType Directory -Force -Path TestResults/${{ matrix.configuration }} | Out-Null
          dotnet --info

      - name: Restore solution
        run: >-
          dotnet restore BluetoothDisable.sln
          -p:Configuration=${{ matrix.configuration }} -p:Platform=x64
          -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
          --verbosity minimal -bl:TestResults/${{ matrix.configuration }}/restore.binlog

      - name: Build Core
        run: >-
          dotnet build BluetoothDisable.Core/BluetoothDisable.Core.csproj
          -c ${{ matrix.configuration }} --no-restore --verbosity minimal
          -bl:TestResults/${{ matrix.configuration }}/core.binlog

      - name: Build Tests
        run: >-
          dotnet build BluetoothDisable.Tests/BluetoothDisable.Tests.csproj
          -c ${{ matrix.configuration }} --no-restore --verbosity minimal
          -bl:TestResults/${{ matrix.configuration }}/tests.binlog

      - name: Run unit tests
        run: >-
          dotnet test BluetoothDisable.Tests/BluetoothDisable.Tests.csproj
          -c ${{ matrix.configuration }} --no-build --no-restore --verbosity normal
          --filter Category!=Hardware
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults/${{ matrix.configuration }}

      # Compile the packaged WinUI project, including XAML/manifest tooling.
      - name: Build WinUI app (x64)
        run: >-
          dotnet build BluetoothDisable.App/BluetoothDisable.App.csproj
          -c ${{ matrix.configuration }} -p:Platform=x64 --no-restore --verbosity minimal
          -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
          -bl:TestResults/${{ matrix.configuration }}/app.binlog

      - name: Build solution (x64)
        run: >-
          dotnet build BluetoothDisable.sln
          -c ${{ matrix.configuration }} -p:Platform=x64 --no-restore --verbosity minimal
          -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
          -bl:TestResults/${{ matrix.configuration }}/solution.binlog

      - name: Read-only discovery smoke on the runner
        run: >-
          dotnet test BluetoothDisable.Tests/BluetoothDisable.Tests.csproj
          -c ${{ matrix.configuration }} --no-build --no-restore
          --filter Category=Hardware --logger "trx;LogFileName=discovery.trx"
          --results-directory TestResults/${{ matrix.configuration }}

      # Reusable workflow failure propagates to the existing mandatory CI Gate.
      # Unsigned local-test artifacts; no production signing secrets or Bluetooth changes.
      - name: Test packaging tool verification
        if: matrix.configuration == 'Release'
        run: ./installer/Test-InnoSetupVerification.ps1

      - name: Test UI discovery completion checks
        if: matrix.configuration == 'Release'
        run: ./installer/Test-DiscoveryCompletion.ps1

      - name: Build self-contained EXE installer and MSIX
        if: matrix.configuration == 'Release'
        run: ./installer/Build-Installer.ps1

      - name: Verify per-user installer and standard uninstall
        if: matrix.configuration == 'Release'
        run: ./installer/Test-Installer.ps1

      - name: Upload installer artifacts and diagnostics
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-preview-installer
          path: |
            windows/artifacts/installer/*.exe
            windows/artifacts/installer/build-info.json
            windows/artifacts/installer/msix/**/*.msix
            windows/artifacts/build/**/*.binlog
            windows/TestResults/installer/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ matrix.configuration }}-diagnostics
          path: |
            windows/TestResults/${{ matrix.configuration }}/*.binlog
            windows/TestResults/${{ matrix.configuration }}/*.trx
          if-no-files-found: warn
          retention-days: 14
