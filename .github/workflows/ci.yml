name: Platform CI

# Do not add paths filters: CI Gate must be reported for every PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete runs only for the same PR. Every push to main must finish.
concurrency:
  group: platform-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect platform changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.detect.outputs.android }}
      windows: ${{ steps.detect.outputs.windows }}
      android_tests: ${{ steps.detect.outputs.android_tests }}
      windows_tests: ${{ steps.detect.outputs.windows_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: |
          python3 -m unittest discover -s scripts -p ci_tests.py
          python3 scripts/sync_site_urls.py --check
          python3 -m unittest discover -s scripts -p site_url_tests.py
          node --test scripts/site-urls.test.mjs scripts/site-api-separation.test.mjs
          python3 scripts/verify_site_routes.py
          python3 scripts/ci_changes.py

  gradle_dist:
    name: Prepare verified Gradle distribution
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify pinned Gradle once
        run: bash scripts/ci_prepare_gradle.sh
      - name: Share verified Gradle with Android jobs
        uses: actions/upload-artifact@v7
        with:
          name: verified-gradle-9.8.2
          path: ${{ runner.temp }}/gradle-dist/gradle-9.8.2-bin.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android_pr:
    needs: [changes, gradle_dist]
    if: always() && needs.changes.outputs.android_tests == 'true' && needs.gradle_dist.result == 'success' && github.event_name != 'push'
    uses: ./.github/workflows/android-ci.yml
    with:
      prepared_gradle: true

  android_main:
    needs: [changes, gradle_dist]
    if: always() && needs.changes.outputs.android_tests == 'true' && needs.gradle_dist.result == 'success' && github.event_name == 'push'
    uses: ./.github/workflows/android-full-compat.yml
    with:
      prepared_gradle: true
    secrets:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  windows:
    needs: changes
    if: needs.changes.outputs.windows_tests == 'true'
    uses: ./.github/workflows/windows.yml

  codeql:
    needs: [changes, gradle_dist]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.windows == 'true') && (needs.changes.outputs.android != 'true' || needs.gradle_dist.result == 'success')
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    uses: ./.github/workflows/codeql.yml
    with:
      android: ${{ needs.changes.outputs.android == 'true' }}
      windows: ${{ needs.changes.outputs.windows == 'true' }}
      prepared_gradle: ${{ needs.changes.outputs.android == 'true' }}

  android_license:
    needs: [changes, gradle_dist]
    if: always() && needs.changes.outputs.android == 'true' && needs.gradle_dist.result == 'success'
    uses: ./.github/workflows/license-check.yml
    with:
      prepared_gradle: true

  windows_audit:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-audit.yml

  android_version:
    needs: changes
    if: needs.changes.outputs.android == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/version-check.yml

  gate:
    name: CI Gate
    if: always()
    needs: [changes, gradle_dist, android_pr, android_main, windows, codeql, android_license, windows_audit, android_version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require all selected checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py
