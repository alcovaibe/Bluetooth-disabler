name: Android CI (PR)

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE.*'

concurrency:
  group: android-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/calculator-ci-release.jks" \
            -storepass calculator-ci-password \
            -keypass calculator-ci-password \
            -alias calculator-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Bluetooth Disabler CI, OU=CI, O=Bluetooth Disabler, C=XX"

      - name: Verify debug and release builds
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/calculator-ci-release.jks
          RELEASE_STORE_PASSWORD: calculator-ci-password
          RELEASE_KEY_ALIAS: calculator-ci
          RELEASE_KEY_PASSWORD: calculator-ci-password
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease

  instrumented-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            arch: x86_64
          - api-level: 27
            arch: x86
          - api-level: 28
            arch: x86_64
          - api-level: 29
            arch: x86_64
          - api-level: 30
            arch: x86_64
          - api-level: 31
            arch: x86_64
          - api-level: 32
            arch: x86_64
          - api-level: 33
            arch: x86_64
          - api-level: 34
            arch: x86_64
          - api-level: 35
            arch: x86_64
          - api-level: 36
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify cover modes on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            adb pull /data/local/tmp/calendar-previews app/build/calendar-previews

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tests-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/calendar-previews/
