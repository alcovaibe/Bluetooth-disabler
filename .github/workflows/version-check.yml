name: Verify version

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version format
        shell: bash
        run: |
          VERSION_NAME=$(grep -R "versionName" -n app/build.gradle* | head -1 | sed -E 's/.*versionName[[:space:]]+[=][[:space:]]*[\"\x27]([^\"\x27]+)[\"\x27].*/\1/')
          echo "Version name: $VERSION_NAME"
          test -n "$VERSION_NAME"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NAME=$(grep -R "versionName" -n app/build.gradle* | head -1 | sed -E 's/.*versionName[[:space:]]+[=][[:space:]]*[\"\x27]([^\"\x27]+)[\"\x27].*/\1/')
          test "$TAG_VERSION" = "$VERSION_NAME"
