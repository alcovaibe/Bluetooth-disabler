name: Test config Worker

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'scripts/create-cloudflare-deploy-config*'
      - 'wrangler.jsonc'
      - '.github/workflows/test-config.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/create-cloudflare-deploy-config*'
      - 'wrangler.jsonc'
      - '.github/workflows/test-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test cloudflare/worker.test.mjs scripts/create-cloudflare-deploy-config.test.mjs
