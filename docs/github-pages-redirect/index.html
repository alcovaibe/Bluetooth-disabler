<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://bluetoothdisable.app/">
  <link rel="canonical" href="https://bluetoothdisable.app/">
  <title>Bluetooth Disable</title>
  <script>
    (function () {
      var prefix = '/Bluetooth-disabler';
      var path = window.location.pathname;

      if (path === prefix || path === prefix + '/') {
        path = '/';
      } else if (path.indexOf(prefix + '/') === 0) {
        path = path.slice(prefix.length);
      } else {
        path = '/';
      }

      window.location.replace(
        'https://bluetoothdisable.app' +
        path +
        window.location.search +
        window.location.hash
      );
    }());
  </script>
</head>
<body>
  <a href="https://bluetoothdisable.app/">Continue to bluetoothdisable.app</a>
</body>
</html>
